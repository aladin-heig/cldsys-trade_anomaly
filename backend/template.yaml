AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Trade anomaly detection platform (HES-SO CloudSys, project 3, group 16).
  Weekly full reload from the UN Comtrade API, gaps served from DynamoDB,
  AI reports generated by a Step Functions workflow calling Claude on Amazon Bedrock.

Parameters:
  ComtradeKeyParameterName:
    Type: String
    Default: trade-anomaly/comtrade-key
    Description: Name of the SecureString parameter holding the UN Comtrade key, without the leading slash.
  ModelId:
    Type: String
    Default: anthropic.claude-haiku-5-5
    Description: Claude model on Amazon Bedrock that writes the explanation.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173
    Description: Origins allowed to call the API (local front-end, then the Amplify domain).
  IngestionSchedule:
    Type: String
    Default: cron(0 6 ? * MON *)
    Description: When the weekly full reload runs (UTC). Default is every Monday at 06:00.

Globals:
  Function:
    Runtime: python3.14
    Architectures: [x86_64]
    Handler: app.handler
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        GAPS_TABLE: !Ref GapsTable

Resources:
  # ---------- Storage ----------
  GapsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------- Ingestion ----------
  IngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/ingestion/
      Description: UN Comtrade API -> raw copy in S3 -> gaps -> DynamoDB
      Timeout: 900
      MemorySize: 2048
      Environment:
        Variables:
          RAW_BUCKET: !Ref RawBucket
          COMTRADE_KEY_PARAMETER: !Ref ComtradeKeyParameterName
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref GapsTable }
        - S3CrudPolicy: { BucketName: !Ref RawBucket }
        - SSMParameterReadPolicy: { ParameterName: !Ref ComtradeKeyParameterName }
      EventInvokeConfig:
        MaximumRetryAttempts: 2
      Events:
        Weekly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref IngestionSchedule
            Description: Reloads the whole history from UN Comtrade and recomputes every gap

  # ---------- Report workflow ----------
  # Context (DynamoDB + Wikipedia) and the call to Claude in one function: the Wikipedia pages stay
  # in it, and only the model's answer goes through Step Functions (256 KB payload limit).
  ExplainFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/explain/
      Description: Report step 1 - context from DynamoDB and Wikipedia, explanation by Claude on Amazon Bedrock
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref GapsTable }
        - Statement:
            - Effect: Allow
              Action: bedrock-mantle:CreateInference
              Resource: "*"

  PdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/pdf/
      Description: Report step 2 - chart and PDF stored in S3
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          REPORTS_BUCKET: !Ref ReportsBucket
      Policies:
        - S3WritePolicy: { BucketName: !Ref ReportsBucket }

  ReportStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD # execution names are unique only for standard workflows
      DefinitionUri: statemachine/report.asl.json
      DefinitionSubstitutions:
        ExplainFunctionArn: !GetAtt ExplainFunction.Arn
        PdfFunctionArn: !GetAtt PdfFunction.Arn
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref ExplainFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref PdfFunction }

  # ---------- API and authentication ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, OPTIONS]
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/api/
      Description: Heatmap reads, report requests and report status
      Environment:
        Variables:
          REPORTS_BUCKET: !Ref ReportsBucket
          STATE_MACHINE_ARN: !Ref ReportStateMachine
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref GapsTable }
        - S3ReadPolicy: { BucketName: !Ref ReportsBucket }
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt ReportStateMachine.Name }
        - Statement:
            - Effect: Allow
              Action: states:DescribeExecution
              Resource: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${ReportStateMachine.Name}:*
      Events:
        Anomalies:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /anomalies }
        StartReport:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /reports }
        ReportStatus:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/reports/{reportId}" }

Outputs:
  ApiUrl:
    Description: Base URL of the API, for the front-end
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  IngestionFunctionName:
    Description: Invoke it once by hand for the initial load (see DEPLOY.md)
    Value: !Ref IngestionFunction
  ReportStateMachineArn:
    Value: !Ref ReportStateMachine
  GapsTableName:
    Value: !Ref GapsTable
  RawBucketName:
    Value: !Ref RawBucket
  ReportsBucketName:
    Value: !Ref ReportsBucket
